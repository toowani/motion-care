<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>f_tau</title><script src="common.js"></script></head>
<body>
<script>
// schematic: tau(n) = (n Dbar + n0 tau0) / (n + n0), Dbar = 18 for illustration
const ch = (() => {
  const W = 320, H = 190, x0 = 40, x1 = 306, y0 = 150, y1 = 18, Db = 18, t0 = 30, n0 = 5;
  const X = n => x0 + (x1 - x0) * n / 20, Y = v => y0 - (y0 - y1) * (v - 12) / (34 - 12);
  const tau = n => (n * Db + n0 * t0) / (n + n0);
  const pts = []; for (let n = 0; n <= 20; n += 0.25) pts.push(X(n).toFixed(1) + ',' + Y(tau(n)).toFixed(1));
  const it = (s, c) => `<tspan font-family="Times New Roman, serif" font-style="italic" font-size="15" fill="${c}">${s}</tspan>`;
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${FONT}">
    <text x="${x1}" y="12" font-size="12" fill="#4A5470" text-anchor="end">개념도</text>
    <line x1="${x0}" y1="${Y(Db)}" x2="${x1}" y2="${Y(Db)}" stroke="#7C3AED" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="${x1}" y="${Y(Db) + 18}" font-size="13" text-anchor="end">${it('D̄', '#7C3AED')}</text>
    <line x1="${X(5)}" y1="${y1 + 6}" x2="${X(5)}" y2="${y0}" stroke="#9CA3AF" stroke-dasharray="3 3"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${X(0)}" cy="${Y(t0)}" r="5" fill="#EA580C"/>
    <circle cx="${X(5)}" cy="${Y(tau(5))}" r="5" fill="#fff" stroke="#EA580C" stroke-width="2.5"/>
    <text x="${X(0) + 10}" y="${Y(t0) - 8}" font-size="13">${it('τ', '#EA580C')}<tspan font-size="10" dy="3" fill="#EA580C">0</tspan><tspan dy="-3" fill="#0F1838"> = 30</tspan></text>
    <text x="${X(5) + 10}" y="${Y(tau(5)) - 8}" font-size="13" fill="#0F1838" font-weight="700">반반</text>
    <line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#0F1838" stroke-width="1.2"/>
    ${[0, 5, 10, 15, 20].map(n => `<text x="${X(n)}" y="${y0 + 16}" font-size="12" fill="#4A5470" text-anchor="middle">${n}</text>`).join('')}
    <text x="${X(5)}" y="${y0 + 33}" font-size="12" fill="#4A5470" text-anchor="middle">${it('n', '#6B7280')}<tspan font-size="10" dy="3" fill="#6B7280">0</tspan></text>
    <text x="${x1}" y="${y0 + 33}" font-size="12" fill="#4A5470" text-anchor="end">기록 수 ${it('n', '#6B7280')} →</text>
  </svg>`;
})();
window.F = {
  title: '⑤ 개인 기준선 <span class="v" style="color:#EA580C">τ</span>',
  section: '3 · 전체 수식',
  size: 40,
  tex: String.raw`\cT{\tau} = \frac{\cK{n}\,\cD{\bar{D}} + \cK{n_0}\,\cT{\tau_0}}{\cK{n} + \cK{n_0}}`,
  side: ch,
  legend: [
    { v: 'T', tex: String.raw`\cT{\tau}`, text: '개인 기준선' },
    { v: 'D', tex: String.raw`\cD{\bar{D}}`, text: '버튼 누른 순간 누적량의 평균', sub: '멀미 완화 버튼' },
    { v: 'K', tex: String.raw`\cK{n}`, text: '기록 수', sub: '주행마다 첫 누름만 · 누적량 5 이상만' },
    { v: 'K', tex: String.raw`\cK{n_0}`, text: '기록이 적으면 출발값 쪽으로', k: '5' },
    { v: 'T', tex: String.raw`\cT{\tau_0}`, text: '출발값', k: '30' },
  ],
};
</script>
</body></html>
