<!doctype html>
<!-- Numbered callouts over an app screenshot (docs/img/ui_r6_*.jpg).
     Render: sh sim/callouts/render.sh   ->  docs/img/<name>_callouts.jpg -->
<html lang="ko"><head><meta charset="utf-8"><title>callouts</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* deck tokens (sim/crave_style.py): navy ink, card #F6F8FC + hairline, blue→cyan gradient for numbered badges */
:root{--ink:#0F1838;--muted:#4A5470;--line:#E6EAF2;--card:#F6F8FC;
  --grad:linear-gradient(135deg,#1550D9 0%,#1F62DA 40%,#4CE1E9 100%)}
html,body{margin:0;background:transparent}
*{box-sizing:border-box}
.card{width:960px;background:#fff;padding:24px;
  font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink)}
.shot{position:relative;width:912px;height:513px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;display:block}
.n{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--grad);color:#fff;
  font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;
  box-shadow:0 2px 8px rgba(15,24,56,.28)}
.legend{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px;margin-top:16px}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:52px}
.li b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--grad);color:#fff;font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.li span{font-size:14.5px;font-weight:700;line-height:1.3;letter-spacing:-0.01em}
.li small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);letter-spacing:0}
</style></head><body>
<div class="card" id="card"><div class="shot" id="shot"><img id="img"></div><div class="legend" id="legend"></div></div>
<script>
const SETS = {
  analysis: { img: 'ui_r6_analysis.jpg', cols: 4, marks: [
    [905, 165, '멀미 가능성 게이지', ''],
    [905, 440, '이번 주행 타일', ''],
    [1100, 162, '그래프 전환', '흔들림 지수 ↔ 멀미 가능성'],
    [1545, 262, '그래프 + 기준선', '주의선 · 높음선'],
    [1540, 646, '멀미 완화 동작 제안', '창밖 보기 · 화면 짧게 · 바람 쐬기 · 가볍게 먹기'],
    [1336, 94, '멀미 완화 버튼', '어느 탭에서나'],
    [1310, 780, '시연 패널', '시연용 · 실제 제품에는 없음'],
  ]},
  // settings: capture after the low-frequency-tone row was added (raw: settings_lowtone_raw.png, credit line painted out)
  settings: { img: 'ui_r7_settings_lowtone.jpg', dir: '', cols: 5, marks: [
    [1059, 306, '아이콘 테마 4종', '주행 중 변경 잠금'],
    [1445, 485, '소리 안내', '질문 · 위험 안내'],
    [1445, 546, '저주파 소리', '100 Hz · 켜기 · 끄기'],
    [1445, 606, '공조 자동 조절', '바깥 공기 · 22°C'],
    [1445, 667, '시연 패널', '시연용 · 제품 없음'],
  ]},
};
const set = SETS[new URLSearchParams(location.search).get('s') || 'analysis'];
document.getElementById('img').src = (set.dir ?? '../../docs/img/') + set.img;
const k = 912 / 1600, shot = document.getElementById('shot'), lg = document.getElementById('legend');
lg.style.setProperty('--cols', set.cols);
set.marks.forEach(([x, y, t, s], i) => {
  const d = document.createElement('div'); d.className = 'n'; d.textContent = i + 1;
  d.style.left = (x * k) + 'px'; d.style.top = (y * k) + 'px'; shot.appendChild(d);
  lg.insertAdjacentHTML('beforeend', `<div class="li"><b>${i + 1}</b><span>${t}${s ? `<small>${s}</small>` : ''}</span></div>`);
});
document.getElementById('img').onload = () => document.fonts.ready.then(() => { document.title = 'H=' + Math.ceil(document.getElementById('card').getBoundingClientRect().height); });
</script></body></html>
