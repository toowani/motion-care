<text x="70.0" y="305.0" font-size="14" fill="#4A5470" text-anchor="start" font-weight="400">멀미 완화 버튼은 본인이나 동승자가 누름 → 누른 순간이 그 차의 멀미 기준으로 쌓임 (지금은 차 한 대에 기준 하나)</text>
